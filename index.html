<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Research Terminal</title>
<style>
  :root{
    --bg:#0B1420; --panel:#121B2B; --ink:#F2EFE7; --muted:#8C93A3; --rule:#24304A;
    --up:#3FA34D; --down:#C24B3F; --accent:#C6A15B;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);padding:24px;}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:20px}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  input,select,button{
    font-family:var(--mono);font-size:13px;background:var(--panel);color:var(--ink);
    border:1px solid var(--rule);border-radius:4px;padding:8px 10px;
  }
  button{cursor:pointer;background:var(--accent);color:var(--bg);font-weight:700;border:none}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
  button:hover{opacity:0.85}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
  th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--rule)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600;font-size:11px}
  .pos{color:var(--up)} .neg{color:var(--down)}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:16px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
  .stat .num{font-size:20px;font-weight:700}
  .stat .lbl{font-size:10.5px;color:var(--muted);margin-top:2px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
  .badge.buy{background:rgba(63,163,77,0.18);color:var(--up)}
  .badge.sell{background:rgba(194,75,63,0.18);color:var(--down)}
  .badge.hold{background:rgba(198,161,91,0.18);color:var(--accent)}
  #status{font-size:12px;color:var(--muted);margin-top:6px}
  #chart{width:100%;height:180px;display:block}
  .remove{cursor:pointer;color:var(--down);font-weight:700}
</style>
</head>
<body>
<h1>Stock Research Terminal</h1>
<div class="sub">Client-side only — no backend, no build step. Prices via Twelve Data (free API key required).</div>

<div class="row">
  <input id="apiKeyInput" type="password" placeholder="Twelve Data API key" style="width:240px" autocomplete="off">
  <button class="ghost" id="saveKeyBtn">Save key</button>
  <span class="sub" id="keyStatus" style="margin:0;align-self:center"></span>
</div>

<div class="row">
  <input id="tickerInput" placeholder="Ticker, e.g. AAPL" style="width:160px" autocomplete="off">
  <button id="lookupBtn">Look up</button>
  <button class="ghost" id="watchBtn">Add to watchlist</button>
</div>
<div id="status"></div>

<div class="card" id="quoteCard" style="display:none">
  <div class="grid" id="quoteGrid"></div>
  <svg id="chart" viewBox="0 0 600 180" preserveAspectRatio="none"></svg>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <strong>Watchlist</strong>
    <span class="sub" style="margin:0">Persisted in your browser's localStorage</span>
  </div>
  <table id="watchTable">
    <thead>
      <tr><th>Ticker</th><th>Price</th><th>Chg %</th><th>RSI(14)</th><th>SMA20/SMA50</th><th>Signal</th><th></th></tr>
    </thead>
    <tbody id="watchBody"></tbody>
  </table>
</div>

<script>
/* ---------- Data layer ----------
   Twelve Data (https://twelvedata.com) serves daily bars with CORS enabled,
   so the page calls it directly — no server needed. It requires a free API
   key, which the user enters in the page and is kept in localStorage. */

const SERIES_URL = (sym, key) =>
  `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(sym)}&interval=1day&outputsize=90&apikey=${encodeURIComponent(key)}`;

function loadApiKey(){
  return localStorage.getItem('srt_twelvedata_key') || '';
}
function saveApiKey(key){
  if(key) localStorage.setItem('srt_twelvedata_key', key);
  else localStorage.removeItem('srt_twelvedata_key');
}

// Quote and history come from the same response; share one request per symbol.
const seriesRequests = new Map();

function fetchSeries(rawSymbol){
  const sym = rawSymbol.trim().toUpperCase();
  if(!seriesRequests.has(sym)){
    const req = (async () => {
      const key = loadApiKey();
      if(!key) throw new Error('Add your Twelve Data API key above first');
      const res = await fetch(SERIES_URL(sym, key));
      const body = await res.json().catch(() => ({}));
      if(body.status !== 'ok' || !body.values || !body.values.length){
        throw new Error(body.message ? body.message.split('. ')[0].replace(/\*/g,'') : 'Price request failed');
      }
      return body;
    })();
    seriesRequests.set(sym, req);
    req.finally(() => seriesRequests.delete(sym)).catch(() => {});
  }
  return seriesRequests.get(sym);
}

async function fetchQuote(rawSymbol){
  const { meta, values } = await fetchSeries(rawSymbol);
  const bar = values[0], prev = values[1] || bar; // newest first
  return {
    symbol: meta.symbol,
    date: bar.datetime,
    open: parseFloat(bar.open), high: parseFloat(bar.high),
    low: parseFloat(bar.low), close: parseFloat(bar.close),
    prevClose: parseFloat(prev.close),
    volume: parseFloat(bar.volume)
  };
}

async function fetchHistory(rawSymbol, days=90){
  const { values } = await fetchSeries(rawSymbol);
  return values.slice().reverse().map(v => ({
    date: v.datetime, close: parseFloat(v.close)
  })).filter(r => !isNaN(r.close)).slice(-days);
}

/* ---------- Technical scoring ---------- */

function sma(values, period){
  if(values.length < period) return null;
  const slice = values.slice(-period);
  return slice.reduce((a,b)=>a+b,0) / period;
}

// Wilder's RSI: seed with a simple average of the first `period` moves, then
// smooth each later move in, as charting platforms do.
function rsi(values, period=14){
  if(values.length < period+1) return null;
  let avgGain=0, avgLoss=0;
  for(let i=1; i<values.length; i++){
    const diff = values[i]-values[i-1];
    const gain = Math.max(diff,0), loss = Math.max(-diff,0);
    if(i <= period){
      avgGain += gain/period; avgLoss += loss/period;
    }else{
      avgGain = (avgGain*(period-1) + gain)/period;
      avgLoss = (avgLoss*(period-1) + loss)/period;
    }
  }
  if(avgLoss===0) return 100;
  const rs = avgGain/avgLoss;
  return 100 - (100/(1+rs));
}

function technicalSignal(closes){
  const last = closes[closes.length-1];
  const sma20 = sma(closes,20), sma50 = sma(closes,50);
  const r = rsi(closes,14);
  let score = 0;
  if(sma20 && sma50){ score += sma20 > sma50 ? 1 : -1; }
  if(r !== null){ if(r<30) score+=1; if(r>70) score-=1; }
  if(sma20 && last > sma20) score += 0.5;
  if(score >= 1) return {label:'BUY', cls:'buy'};
  if(score <= -1) return {label:'SELL', cls:'sell'};
  return {label:'HOLD', cls:'hold'};
}

/* ---------- UI ---------- */

function loadWatchlist(){
  return JSON.parse(localStorage.getItem('srt_watchlist') || '[]');
}
function saveWatchlist(list){
  localStorage.setItem('srt_watchlist', JSON.stringify(list));
}

function setStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = isError ? 'var(--down)' : 'var(--muted)';
}

function drawChart(history){
  const svg = document.getElementById('chart');
  if(!history.length){ svg.innerHTML=''; return; }
  const closes = history.map(h=>h.close);
  const min = Math.min(...closes), max = Math.max(...closes);
  const w=600, h=180, pad=10;
  const pts = closes.map((c,i)=>{
    const x = pad + (i/(closes.length-1))*(w-pad*2);
    const y = h-pad - ((c-min)/(max-min||1))*(h-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
}

async function lookup(){
  const raw = document.getElementById('tickerInput').value;
  if(!raw) return;
  setStatus('Fetching...');
  try{
    const [quote, history] = await Promise.all([fetchQuote(raw), fetchHistory(raw)]);
    const closes = history.map(h=>h.close);
    const signal = technicalSignal(closes.length ? closes : [quote.close]);
    const chgPct = ((quote.close - quote.prevClose)/quote.prevClose*100);

    document.getElementById('quoteCard').style.display = 'block';
    document.getElementById('quoteGrid').innerHTML = `
      <div class="stat"><div class="num">${quote.symbol}</div><div class="lbl">Ticker</div></div>
      <div class="stat"><div class="num">$${quote.close.toFixed(2)}</div><div class="lbl">Last close (${quote.date})</div></div>
      <div class="stat"><div class="num ${chgPct>=0?'pos':'neg'}">${chgPct>=0?'+':''}${chgPct.toFixed(2)}%</div><div class="lbl">Day change</div></div>
      <div class="stat"><div class="num"><span class="badge ${signal.cls}">${signal.label}</span></div><div class="lbl">Technical signal</div></div>
    `;
    drawChart(history);
    setStatus(`Loaded ${quote.symbol} — ${history.length} days of history.`);
  }catch(err){
    document.getElementById('quoteCard').style.display = 'none';
    setStatus('Could not load that ticker. Check the symbol and try again. (' + err.message + ')', true);
  }
}

async function refreshWatchlistRow(sym){
  try{
    const [quote, history] = await Promise.all([fetchQuote(sym), fetchHistory(sym)]);
    const closes = history.map(h=>h.close);
    const signal = technicalSignal(closes.length ? closes : [quote.close]);
    const chgPct = ((quote.close - quote.prevClose)/quote.prevClose*100);
    return {
      sym, price: quote.close, chgPct,
      rsi: rsi(closes,14), sma20: sma(closes,20), sma50: sma(closes,50),
      signal
    };
  }catch(err){
    return { sym, error: true };
  }
}

async function renderWatchlist(){
  const list = loadWatchlist();
  const tbody = document.getElementById('watchBody');
  tbody.innerHTML = list.map(s => `<tr id="row-${s}"><td>${s}</td><td colspan="5">loading…</td></tr>`).join('');
  for(const sym of list){
    const row = await refreshWatchlistRow(sym);
    const tr = document.getElementById(`row-${sym}`);
    if(!tr) continue;
    if(row.error){
      tr.innerHTML = `<td>${sym}</td><td colspan="4" class="neg">failed to load</td><td class="remove" data-sym="${sym}">remove</td>`;
      continue;
    }
    tr.innerHTML = `
      <td>${row.sym}</td>
      <td>$${row.price.toFixed(2)}</td>
      <td class="${row.chgPct>=0?'pos':'neg'}">${row.chgPct>=0?'+':''}${row.chgPct.toFixed(2)}%</td>
      <td>${row.rsi!==null ? row.rsi.toFixed(1) : '—'}</td>
      <td>${row.sma20 && row.sma50 ? (row.sma20>row.sma50?'20 > 50':'20 < 50') : '—'}</td>
      <td><span class="badge ${row.signal.cls}">${row.signal.label}</span></td>
      <td class="remove" data-sym="${sym}">remove</td>
    `;
  }
  tbody.querySelectorAll('.remove').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = el.getAttribute('data-sym');
      saveWatchlist(loadWatchlist().filter(x=>x!==s));
      renderWatchlist();
    });
  });
}

document.getElementById('lookupBtn').addEventListener('click', lookup);
document.getElementById('tickerInput').addEventListener('keydown', e=>{ if(e.key==='Enter') lookup(); });
document.getElementById('watchBtn').addEventListener('click', ()=>{
  const sym = document.getElementById('tickerInput').value.trim().toUpperCase();
  if(!sym) return;
  const list = loadWatchlist();
  if(!list.includes(sym)){ list.push(sym); saveWatchlist(list); renderWatchlist(); }
});

function showKeyStatus(){
  document.getElementById('keyStatus').innerHTML = loadApiKey()
    ? 'Key saved in this browser.'
    : 'No key yet — get a free one at <a href="https://twelvedata.com/pricing" target="_blank" rel="noopener" style="color:var(--accent)">twelvedata.com</a>';
}
document.getElementById('apiKeyInput').value = loadApiKey();
document.getElementById('saveKeyBtn').addEventListener('click', ()=>{
  saveApiKey(document.getElementById('apiKeyInput').value.trim());
  showKeyStatus();
  renderWatchlist();
});

showKeyStatus();
renderWatchlist();
</script>
</body>
</html>
